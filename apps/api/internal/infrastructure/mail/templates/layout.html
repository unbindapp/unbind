<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#eef7ee;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#011801;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7ee;padding:40px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;">
<tr><td style="padding:0 4px 16px 4px;">
<table role="presentation" cellspacing="0" cellpadding="0"><tr>
<td style="vertical-align:middle;"><img src="cid:logo.png" width="28" height="28" alt="" style="display:block;width:28px;height:28px;border:0;"></td>
<td style="vertical-align:middle;padding-left:8px;font-size:19px;font-weight:700;letter-spacing:-0.01em;color:#011801;">Unbind</td>
</tr></table>
</td></tr>
<tr><td style="background:#ffffff;border:1px solid #d6e0d6;border-radius:16px;padding:8px 0 4px 0;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
<tr><td style="padding:24px 28px 0 28px;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-0.01em;color:#011801;">{{.Heading}}</td></tr>
{{range .Paragraphs}}<tr><td style="padding:14px 28px 0 28px;font-size:15px;line-height:1.55;color:#506250;">{{.}}</td></tr>
{{end}}{{if .ButtonURL}}<tr><td style="padding:24px 28px 0 28px;">
<a href="{{.ButtonURL}}" style="display:inline-block;background:#011801;color:#eef7ee;text-decoration:none;font-size:15px;font-weight:600;padding:12px 20px;border-radius:10px;">{{.ButtonLabel}}</a>
</td></tr>
<tr><td style="padding:14px 28px 0 28px;font-size:13px;line-height:1.5;color:#506250;word-break:break-all;">If the button does not work, open this link: <a href="{{.ButtonURL}}" style="color:#011801;">{{.ButtonURL}}</a></td></tr>
{{end}}{{if .Note}}<tr><td style="padding:20px 28px 0 28px;font-size:13px;line-height:1.5;color:#506250;">{{.Note}}</td></tr>
{{end}}<tr><td style="padding:24px 28px 24px 28px;"></td></tr>
</table>
</td></tr>
<tr><td style="padding:16px 4px 0 4px;font-size:12px;line-height:1.5;color:#506250;">Sent by your Unbind instance{{if .InstanceURL}} at <a href="{{.InstanceURL}}" style="color:#506250;">{{.InstanceURL}}</a>{{end}}.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
