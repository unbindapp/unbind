# definitions/databases/redis/definition.yaml
# Helm values for CloudPirates Redis chart

# Total nodes (default 1). int-coerce: schema defaults are float64 and `gt` needs matching types.
{{- $requestedReplicas := .Parameters.common.replicas | default 1 | int -}}

# Apply common labels to all resources created by the chart
commonLabels:
  unbind/usd-type: {{ .Definition.Type | quote }}
  unbind/usd-version: {{ .Definition.Version | quote }}
  unbind/usd-category: databases
  {{- range $key, $value := .Parameters.labels }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

# commonLabels don't reach the pod template; podLabels do. The platform detects
# readiness by the unbind-service label, so the pods need it. Only emit unbind-*
# keys. The chart already sets app.kubernetes.io/* on the pod template, and
# re-emitting them here produces duplicate map keys that break post-render.
podLabels:
  {{- range $key, $value := .Parameters.labels }}
  {{- if hasPrefix "unbind" $key }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

# Image configuration - tag follows the selected version (default 8.8)
image:
  registry: docker.io
  repository: redis
  tag: {{ .Parameters.version | default "8.10" | quote }}

# Authentication
auth:
  enabled: true
  existingSecret: {{ .Parameters.secretName | quote }}
  existingSecretPasswordKey: {{ .Parameters.secretKey | quote }}

{{- if gt $requestedReplicas 1 }}
# --- Replication Mode ---
# Triggered if .Parameters.common.replicas >= 2
# replicaCount is total nodes (1 master + N-1 replicas)

architecture: replication
replicaCount: {{ $requestedReplicas }}

{{- else }}
# --- Standalone Mode ---
# Triggered if .Parameters.common.replicas = 1 (or omitted, as default is 1)

architecture: standalone

{{- end }}

# Persistence configuration
# Quote values: CloudPirates' schema requires these as strings (unquoted "10" -> number).
persistence:
  enabled: true
  size: {{ .Parameters.common.storage | default "1Gi" | quote }}
{{- if .Parameters.common.existingClaim }}
  existingClaim: {{ .Parameters.common.existingClaim | quote }}
{{- else }}
  # The chart only labels volumeClaimTemplates with selectorLabels and persistence.labels, so the
  # unbind-* labels the platform uses to find PVCs must be passed here as well.
  # unbind-deployment changes every deploy; volumeClaimTemplates are immutable, so
  # including it makes every helm upgrade fail on the StatefulSet.
  labels:
    {{- range $key, $value := .Parameters.labels }}
    {{- if and (hasPrefix "unbind" $key) (ne $key "unbind-deployment") }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
{{- end }}

# Resource configuration
resources:
  requests:
    cpu: {{ .Parameters.common.resources.requests.cpu | default "100m" | quote }}
    memory: {{ .Parameters.common.resources.requests.memory | default "128Mi" | quote }}
{{- with .Parameters.common.resources.limits }}
{{- if or .cpu .memory }}
  limits:
{{- if .cpu }}
    cpu: {{ .cpu | quote }}
{{- end }}
{{- if .memory }}
    memory: {{ .memory | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Parameters.maxMemory }}
# The policy stays noeviction, queues and sessions break when keys are evicted
extraConfig: |
  maxmemory {{ .Parameters.maxMemory }}
{{- end }}

{{- if hasKey .Parameters "appendOnly" }}
{{- $appendOnly := ternary "yes" "no" (eq (toString .Parameters.appendOnly) "true") }}
{{- $resources := dict "requests" (dict "cpu" (.Parameters.common.resources.requests.cpu | default "100m") "memory" (.Parameters.common.resources.requests.memory | default "128Mi")) }}
{{- with .Parameters.common.resources.limits }}
{{- $limits := dict }}
{{- if .cpu }}{{ $_ := set $limits "cpu" .cpu }}{{ end }}
{{- if .memory }}{{ $_ := set $limits "memory" .memory }}{{ end }}
{{- if $limits }}{{ $_ := set $resources "limits" $limits }}{{ end }}
{{- end }}
extraFlags:
  - --appendonly {{ $appendOnly }}

# Redis started with appendonly yes over a dump.rdb and no append-only file starts empty
extraVolumes:
  - name: aof-convert
    emptyDir: {}
extraInitContainers:
  - name: aof-convert
    image: "docker.io/redis:{{ .Parameters.version | default "8.10" }}"
    env:
      - name: APPEND_ONLY
        value: {{ $appendOnly | quote }}
    command:
      - /bin/sh
      - -ec
      - |
        cd /data
        manifest=appendonlydir/appendonly.aof.manifest
        sock=/aof-convert/redis.sock
        cli() { redis-cli -s "$sock" "$@"; }
        start() {
          redis-server --port 0 --unixsocket "$sock" --dir /data --save "" --appendonly "$1" &
          pid=$!
          until [ "$(cli ping 2>/dev/null)" = PONG ]; do
            kill -0 "$pid"
            sleep 1
          done
        }
        stop() {
          cli shutdown "$@" >/dev/null 2>&1 || true
          wait "$pid"
        }
        rewrite_done() {
          info=$(cli info persistence | tr -d '\r')
          if echo "$info" | grep -qx 'aof_last_bgrewrite_status:err'; then
            echo "AOF rewrite failed"
            exit 1
          fi
          [ -f "$manifest" ] && echo "$info" | grep -qx 'aof_rewrite_in_progress:0' && echo "$info" | grep -qx 'aof_rewrite_scheduled:0'
        }
        if [ -d appendonlydir ] && [ ! -f "$manifest" ]; then
          echo "Removing an append-only directory without a manifest"
          rm -rf appendonlydir
        fi
        if [ "$APPEND_ONLY" = yes ] && [ ! -f "$manifest" ] && [ -f dump.rdb ]; then
          echo "Converting dump.rdb to an append-only file"
          start no
          cli config set appendonly yes >/dev/null
          until rewrite_done; do sleep 1; done
          stop
        fi
        if [ "$APPEND_ONLY" = no ] && [ -f "$manifest" ]; then
          echo "Converting the append-only file to dump.rdb"
          start yes
          [ "$(cli save)" = OK ]
          stop nosave
          rm "$manifest"
          rm -rf appendonlydir
        fi
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources: {{ toJson $resources }}
    volumeMounts:
      - name: data
        mountPath: /data
      - name: aof-convert
        mountPath: /aof-convert
{{- end }}

# Disable metrics
metrics:
  enabled: false

{{- if .Parameters.s3.enabled }}
{{- $s3 := .Parameters.s3 }}
{{- $backupPath := printf "s3://%s/%s/backups/%s/" $s3.bucket ($s3.backupPrefix | default "redis") .Name }}
extraObjects:
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: {{ .Name }}-s3-backup
      namespace: {{ .Namespace }}
      labels:
        unbind/usd-type: {{ .Definition.Type | quote }}
        unbind/usd-version: {{ .Definition.Version | quote }}
        unbind/usd-category: databases
        app.kubernetes.io/instance: {{ .Name }}
        app.kubernetes.io/managed-by: Helm
        {{- range $key, $value := .Parameters.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      schedule: {{ $s3.backupSchedule | default "0 0 * * *" | quote }}
      concurrencyPolicy: Forbid
      jobTemplate:
        spec:
          ttlSecondsAfterFinished: 300
          backoffLimit: 2
          template:
            spec:
              restartPolicy: Never
              # Pod 0 is the primary in both standalone and replication mode
              initContainers:
                - name: dump
                  image: "docker.io/redis:{{ .Parameters.version | default "8.10" }}"
                  env:
                    - name: REDISCLI_AUTH
                      valueFrom:
                        secretKeyRef:
                          name: {{ .Parameters.secretName }}
                          key: {{ .Parameters.secretKey }}
                  command:
                    - /bin/sh
                    - -ec
                    - |
                      redis-cli -h {{ .Name }}-0.{{ .Name }}-headless.{{ .Namespace }}.svc.cluster.local --rdb /backup/dump.rdb
                      redis-check-rdb /backup/dump.rdb
                  securityContext:
                    runAsUser: 999
                    runAsGroup: 999
                    runAsNonRoot: true
                    privileged: false
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
                  volumeMounts:
                    - name: backup
                      mountPath: /backup
              containers:
                - name: upload
                  image: amazon/aws-cli:2.37.11
                  env:
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: {{ $s3.secretName }}
                          key: {{ $s3.accessKey | default "access_key_id" }}
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: {{ $s3.secretName }}
                          key: {{ $s3.secretKey | default "secret_key" }}
                    {{- if $s3.region }}
                    - name: AWS_DEFAULT_REGION
                      value: {{ $s3.region | quote }}
                    {{- end }}
                  command:
                    - /bin/sh
                    - -ec
                    - |
                      BACKUP_PATH={{ $backupPath | quote }}
                      RETENTION={{ $s3.backupRetention | default 2 }}

                      aws s3 cp /backup/dump.rdb "${BACKUP_PATH}$(date -u +%Y%m%d_%H%M%S).rdb" \
                        --endpoint-url={{ $s3.endpoint | quote }} --checksum-algorithm CRC32

                      BACKUPS=$(aws s3 ls "$BACKUP_PATH" --endpoint-url={{ $s3.endpoint | quote }} \
                        | awk '{print $4}' \
                        | grep -E '^[0-9]{8}_[0-9]{6}\.rdb$' \
                        | sort || true)
                      BACKUP_COUNT=$(echo "$BACKUPS" | grep -c . || true)

                      if [ "$BACKUP_COUNT" -le "$RETENTION" ]; then
                        echo "Have $BACKUP_COUNT backups, retention is $RETENTION. Nothing to delete."
                        exit 0
                      fi

                      echo "$BACKUPS" | head -n "$((BACKUP_COUNT - RETENTION))" | while read -r file; do
                        echo "Deleting old backup: $file"
                        aws s3 rm "${BACKUP_PATH}${file}" --endpoint-url={{ $s3.endpoint | quote }}
                      done
                  volumeMounts:
                    - name: backup
                      mountPath: /backup
              volumes:
                - name: backup
                  emptyDir: {}
{{- end }}
