components:
  schemas:
    APIKeyResource:
      additionalProperties: false
      properties:
        resource_id:
          format: uuid
          type: string
        resource_type:
          $ref: "#/components/schemas/ResourceType"
      required:
        - resource_type
        - resource_id
      type: object
    AffectedService:
      additionalProperties: false
      properties:
        action:
          enum:
            - build
            - redeploy
            - restart
            - none
          type: string
        deployment_id:
          description: The deployment created for the service, when one was created immediately
          format: uuid
          type: string
        icon:
          type: string
        name:
          type: string
        reasons:
          description: "Why the service is affected: its config, its own variables, or variables it references"
          items:
            type: string
          type: array
        service_id:
          format: uuid
          type: string
      required:
        - service_id
        - name
        - icon
        - action
        - reasons
      type: object
    ApplyStagedChangesInput:
      additionalProperties: false
      properties:
        dry_run:
          description: Validate the changes and report the affected services without applying anything
          type: boolean
        services:
          description: Config changes, one entry per service
          items:
            $ref: "#/components/schemas/UpdateServiceInput"
          type:
            - array
            - "null"
        variables:
          description: Variable changes grouped by scope
          items:
            $ref: "#/components/schemas/StagedVariables"
          type:
            - array
            - "null"
      type: object
    ApplyStagedChangesResponse:
      additionalProperties: false
      properties:
        affected:
          items:
            $ref: "#/components/schemas/AffectedService"
          type: array
        dry_run:
          type: boolean
        failures:
          items:
            $ref: "#/components/schemas/ChangeFailure"
          type: array
      required:
        - dry_run
        - affected
        - failures
      type: object
    ApplyStagedChangesResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ApplyStagedChangesResponse"
      required:
        - data
      type: object
    AvailableVariableReference:
      additionalProperties: false
      properties:
        keys:
          items:
            type: string
          type:
            - array
            - "null"
        source_icon:
          type: string
        source_id:
          format: uuid
          type: string
        source_kubernetes_name:
          type: string
        source_name:
          type: string
        source_type:
          $ref: "#/components/schemas/VariableReferenceSourceType"
        type:
          $ref: "#/components/schemas/VariableReferenceType"
      required:
        - type
        - source_kubernetes_name
        - source_name
        - source_icon
        - source_type
        - source_id
        - keys
      type: object
    BaseVariablesJSONInput:
      additionalProperties: false
      properties:
        environment_id:
          description: If present without service_id, mutate environment variables - requires project_id
          format: uuid
          type: string
        project_id:
          description: If present without environment_id, mutate team variables
          format: uuid
          type: string
        service_id:
          description: If present, mutate service variables - requires project_id and environment_id
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
        type:
          $ref: "#/components/schemas/VariableReferenceSourceType"
          description: The type of variable
      required:
        - type
        - team_id
      type: object
    CancelDeploymentInputBody:
      additionalProperties: false
      properties:
        deployment_id:
          format: uuid
          type: string
        environment_id:
          format: uuid
          type: string
        project_id:
          format: uuid
          type: string
        service_id:
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
      required:
        - team_id
        - project_id
        - service_id
        - environment_id
        - deployment_id
      type: object
    CancelDeploymentOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeploymentResponse"
      required:
        - data
      type: object
    Capabilities:
      additionalProperties: false
      properties:
        add:
          items:
            type: string
          type:
            - array
            - "null"
        drop:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    CertManagerCondition:
      enum:
        - Ready
        - InvalidRequest
        - Approved
        - Denied
      title: CertManagerCondition
      type: string
    ChangeFailure:
      additionalProperties: false
      properties:
        message:
          type: string
        service_id:
          description: Set when a service config change failed
          format: uuid
          type: string
        variables:
          $ref: "#/components/schemas/BaseVariablesJSONInput"
          description: Set when a variable change failed
      required:
        - message
      type: object
    ContainerState:
      enum:
        - running
        - waiting
        - terminated
        - terminating
        - crashing
        - not_ready
        - image_pull_error
        - starting
      title: ContainerState
      type: string
    ContainerStatus:
      additionalProperties: false
      properties:
        crash_loop_reason:
          type: string
        events:
          items:
            $ref: "#/components/schemas/EventRecord"
          type: array
        is_crashing:
          type: boolean
        kubernetes_name:
          type: string
        last_exit_code:
          format: int32
          type: integer
        last_termination:
          type: string
        pod_created_at:
          format: date-time
          type: string
        ready:
          type: boolean
        restart_count:
          format: int32
          type: integer
        state:
          $ref: "#/components/schemas/ContainerState"
        state_message:
          type: string
        state_reason:
          type: string
      required:
        - kubernetes_name
        - ready
        - restart_count
        - state
        - is_crashing
      type: object
    ConvexAdminKeyParams:
      additionalProperties: false
      properties:
        AdminKeyOutputKey:
          type: string
        InstanceName:
          type: string
        SecretOutputKey:
          type: string
      required:
        - InstanceName
        - SecretOutputKey
        - AdminKeyOutputKey
      type: object
    CreateBuildInputBody:
      additionalProperties: false
      properties:
        disable_build_cache:
          description: Disable build cache for this deployment
          type: boolean
        environment_id:
          format: uuid
          type: string
        git_sha:
          description: The git sha of the deployment
          type:
            - string
            - "null"
        project_id:
          format: uuid
          type: string
        service_id:
          format: uuid
          type: string
        smart_redeploy:
          description: Try to intelligently deploy the current image without rebuilding if possible
          type: boolean
        team_id:
          format: uuid
          type: string
      required:
        - team_id
        - project_id
        - service_id
        - environment_id
      type: object
    CreateBuildOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeploymentResponse"
      required:
        - data
      type: object
    CreateEnvironmentInput:
      additionalProperties: false
      properties:
        description:
          type:
            - string
            - "null"
        name:
          description: Has to be unique in the project
          maxLength: 32
          minLength: 1
          type: string
        project_id:
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
      required:
        - team_id
        - project_id
        - name
        - description
      type: object
    CreateEnvironmentResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/EnvironmentResponse"
      required:
        - data
      type: object
    CreatePVCInput:
      additionalProperties: false
      properties:
        capacity_gb:
          format: double
          type: number
        description:
          type: string
        environment_id:
          format: uuid
          type: string
        mount_path:
          description: Path to mount the volume at on the service, requires service_id
          type: string
        name:
          description: Has to be unique among the volumes of the same scope. A taken name gets a short suffix, so read the name from the response
          maxLength: 32
          minLength: 1
          type: string
        project_id:
          format: uuid
          type: string
        service_id:
          description: Service to attach the volume to, requires mount_path
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
        type:
          $ref: "#/components/schemas/PvcScope"
      required:
        - type
        - name
        - team_id
        - capacity_gb
      type: object
    CreatePVCResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PVCInfo"
      required:
        - data
      type: object
    CreateProjectInput:
      additionalProperties: false
      properties:
        description:
          type:
            - string
            - "null"
        name:
          description: Has to be unique in the team
          maxLength: 32
          minLength: 1
          type: string
        team_id:
          format: uuid
          type: string
      required:
        - team_id
        - name
      type: object
    CreateProjectResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ProjectResponse"
      required:
        - data
      type: object
    CreateS3BucketOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/S3BucketResponse"
      required:
        - data
      type: object
    CreateServiceGroupInput:
      additionalProperties: false
      properties:
        description:
          description: The description of the service group
          type: string
        environment_id:
          format: uuid
          type: string
        icon:
          description: The icon of the service group
          type: string
        name:
          description: Has to be unique in the environment. A taken name gets a short suffix, so read the name from the response
          maxLength: 32
          minLength: 1
          type: string
        project_id:
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
      required:
        - name
        - team_id
        - project_id
        - environment_id
      type: object
    CreateServiceGroupResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ServiceGroupResponse"
      required:
        - data
      type: object
    CreateServiceInput:
      additionalProperties: false
      properties:
        auto_deploy:
          description: Deploy on every push to the branch. Only for a GitHub service, defaults to true
          type: boolean
        backup_retention_count:
          description: Number of base backups to retain, e.g. 3
          format: int64
          minimum: 1
          type: integer
        backup_schedule:
          description: Cron expression for the backup schedule, e.g. '0 0 * * *'
          type: string
        builder:
          $ref: "#/components/schemas/ServiceBuilder"
          description: Builder of the service - docker, nixpacks, railpack
        database_config:
          $ref: "#/components/schemas/DatabaseConfig"
        database_type:
          type: string
        description:
          type: string
        docker_builder_build_context:
          description: Optional path to Dockerfile context, if using docker builder
          type: string
        docker_builder_dockerfile_path:
          description: Optional path to Dockerfile, if using docker builder
          type: string
        environment_id:
          format: uuid
          type: string
        github_installation_id:
          format: int64
          type: integer
        health_check:
          $ref: "#/components/schemas/HealthCheck"
          description: Health check configuration for the service
        hosts:
          items:
            $ref: "#/components/schemas/HostSpec"
          type:
            - array
            - "null"
        image:
          type: string
        init_containers:
          description: Init containers to run before the main container
          items:
            $ref: "#/components/schemas/InitContainer"
          type:
            - array
            - "null"
        is_public:
          description: Whether the service is reachable from the internet. Defaults to true for a service with a port and to false for a database
          type: boolean
        name:
          description: Has to be unique in the environment. A taken name gets a short suffix, so read the name from the response
          maxLength: 32
          minLength: 1
          type: string
        ports:
          items:
            $ref: "#/components/schemas/PortSpec"
          type:
            - array
            - "null"
        project_id:
          format: uuid
          type: string
        railpack_builder_build_command:
          type: string
        railpack_builder_install_command:
          type: string
        replicas:
          format: int32
          maximum: 10
          minimum: 1
          type: integer
        repository_name:
          description: Must be a repository the GitHub installation has access to
          type: string
        repository_owner:
          description: Must be the account the GitHub installation belongs to
          type: string
        resources:
          $ref: "#/components/schemas/Resources"
          description: Resource limits and requests for the service containers
        run_command:
          type: string
        s3_backup_bucket_id:
          description: S3 bucket to store database backups in. Only for databases that support backups, Redis does not
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
        type:
          $ref: "#/components/schemas/ServiceType"
          description: Type of service, e.g. 'github', 'docker-image'
        variable_mounts:
          description: Mount variables as volumes
          items:
            $ref: "#/components/schemas/VariableMount"
          type:
            - array
            - "null"
        volumes:
          description: Volumes to mount in the service
          items:
            $ref: "#/components/schemas/ServiceVolume"
          type:
            - array
            - "null"
      required:
        - team_id
        - project_id
        - environment_id
        - name
        - type
        - builder
      type: object
    CreateServiceResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ServiceResponse"
      required:
        - data
      type: object
    CreateWebhookResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/WebhookResponse"
      required:
        - data
      type: object
    DNSStatus:
      enum:
        - unknown
        - resolved
        - unresolved
      title: DNSStatus
      type: string
    DatabaseConfig:
      additionalProperties: false
      properties:
        defaultDatabaseName:
          type: string
        initdb:
          type: string
        innodbBufferPoolSizeMb:
          description: MySQL innodb_buffer_pool_size in megabytes. 0 sizes it from the memory limit, which is right for most databases. At most three quarters of the memory limit, and rounded down to whole 128MB chunks. Changing it restarts the database
          format: int64
          minimum: 0
          type: integer
        maxReplicationSlots:
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        maxSlotWalKeepSizeMb:
          format: int64
          minimum: 0
          type: integer
        maxWalSenders:
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        sharedBuffersMb:
          description: PostgreSQL shared_buffers in megabytes. 0 sizes it from the memory limit, which is right for most databases. At most half of the memory limit. Changing it restarts the database
          format: int64
          minimum: 0
          type: integer
        storage:
          type: string
        version:
          type: string
        walLevel:
          $ref: "#/components/schemas/WalLevel"
      type: object
    DatabaseConfigResponse:
      additionalProperties: false
      properties:
        default_database_name:
          type: string
        innodb_buffer_pool_size_mb:
          format: int64
          type: integer
        max_replication_slots:
          format: int64
          type: integer
        max_slot_wal_keep_size_mb:
          format: int64
          type: integer
        max_wal_senders:
          format: int64
          type: integer
        shared_buffers_mb:
          format: int64
          type: integer
        storage:
          type: string
        version:
          type: string
        wal_level:
          $ref: "#/components/schemas/WalLevel"
      required:
        - max_replication_slots
        - max_wal_senders
        - max_slot_wal_keep_size_mb
        - shared_buffers_mb
        - innodb_buffer_pool_size_mb
      type: object
    DatabaseConfigurable:
      additionalProperties: false
      properties:
        default:
          type: string
        options:
          items:
            type: string
          type: array
      required:
        - default
        - options
      type: object
    DatabaseConfigurables:
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/DatabaseConfigurable"
      required:
        - version
      type: object
    DeleteEnvironmentInputBody:
      additionalProperties: false
      properties:
        environment_id:
          type: string
        project_id:
          type: string
        team_id:
          type: string
      required:
        - team_id
        - project_id
        - environment_id
      type: object
    DeleteEnvironmentResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeletePVCInput:
      additionalProperties: false
      properties:
        environment_id:
          format: uuid
          type: string
        id:
          type: string
        project_id:
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
        type:
          $ref: "#/components/schemas/PvcScope"
      required:
        - id
        - type
        - team_id
      type: object
    DeletePVCResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeleteProjectInputBody:
      additionalProperties: false
      properties:
        project_id:
          type: string
        team_id:
          type: string
      required:
        - team_id
        - project_id
      type: object
    DeleteProjectResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeleteS3BucketInputBody:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
      required:
        - id
        - team_id
      type: object
    DeleteS3BucketOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeleteServiceGroupInput:
      additionalProperties: false
      properties:
        delete_services:
          description: Whether to delete the services in the service group
          type: boolean
        environment_id:
          description: The ID of the environment
          format: uuid
          type: string
        id:
          description: The ID of the service group
          format: uuid
          type: string
        project_id:
          description: The ID of the project
          format: uuid
          type: string
        team_id:
          description: The ID of the team
          format: uuid
          type: string
      required:
        - id
        - team_id
        - project_id
        - environment_id
      type: object
    DeleteServiceGroupResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeleteServiceInputBody:
      additionalProperties: false
      properties:
        environment_id:
          type: string
        project_id:
          type: string
        service_id:
          type: string
        team_id:
          type: string
      required:
        - team_id
        - project_id
        - environment_id
        - service_id
      type: object
    DeleteServiceResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeleteVariablesInputBody:
      additionalProperties: false
      properties:
        environment_id:
          description: If present without service_id, mutate environment variables - requires project_id
          format: uuid
          type: string
        project_id:
          description: If present without environment_id, mutate team variables
          format: uuid
          type: string
        service_id:
          description: If present, mutate service variables - requires project_id and environment_id
          format: uuid
          type: string
        team_id:
          format: uuid
          type: string
        type:
          $ref: "#/components/schemas/VariableReferenceSourceType"
          description: The type of variable
        variables:
          items:
            $ref: "#/components/schemas/VariableDeleteInput"
          type: array
      required:
        - variables
        - type
        - team_id
      type: object
    DeleteWebhookInputBody:
      additionalProperties: false
      properties:
        id:
          type: string
        project_id:
          type: string
        team_id:
          type: string
        type:
          $ref: "#/components/schemas/WebhookType"
      required:
        - id
        - type
        - team_id
      type: object
    DeleteWebhookResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/DeletedResponse"
      required:
        - data
      type: object
    DeletedResponse:
      additionalProperties: false
      properties:
        deleted:
          type: boolean
        id:
          type: string
      required:
        - id
        - deleted
      type: object
    DeployedTemplateInput:
      additionalProperties: false
      properties:
        current_value:
          type: string
        current_value_gb:
          description: Numeric GB value for volume/database size inputs, consistent with PVCInfo.capacity_gb
          format: double
          type: number
        default:
          type: string
        default_gb:
          description: Numeric GB form of Default for volume/database size inputs
          format: double
          type: number
        description:
          type: string
        editable:
          type: boolean
        editable_reason:
          type: string
        hidden:
          type: boolean
        id:
          type: string
        name:
          type: string
        port_protocol:
          $ref: "#/components/schemas/Protocol"
        required:
          type: boolean
        service_id:
          format: uuid
          type: string
        target_port:
          format: int64
          type: integer
        type:
          $ref: "#/components/schemas/TemplateInputType"
        volume:
          $ref: "#/components/schemas/DeployedTemplateVolume"
      required:
        - id
        - name
        - type
        - description
        - required
        - hidden
        - current_value
        - editable
      type: object
    DeployedTemplateVolume:
      additionalProperties: false
      properties:
        mountPath:
          type: string
        name:
          type: string
      required:
        - name
        - mountPath
      type: object
    DeploymentResponse:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          type: integer
        builder:
          $ref: "#/components/schemas/ServiceBuilder"
        commit_author:
          $ref: "#/components/schemas/GitCommitter"
        commit_message:
          type: string
        commit_sha:
          type: string
        completed_at:
          format: date-time
          type: string
        crashing_reasons:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        docker_builder_build_context:
          type: string
        docker_builder_dockerfile_path:
          type: string
        error:
          type: string
        git_branch:
          type: string
        id:
          format: uuid
          type: string
        image:
          type: string
        job_name:
          type: string
        queued_at:
          format: date-time
          type: string
        railpack_builder_build_command:
          type: string
        railpack_builder_install_command:
          type: string
        replica_events:
          items:
            $ref: "#/components/schemas/EventRecord"
          type: array
        replica_restarts:
          format: int32
          type: integer
        run_command:
          type: string
        service_id:
          format: uuid
          type: string
        started_at:
          format: date-time
          type: string
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        status_message:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - service_id
        - status
        - crashing_reasons
        - replica_events
        - replica_restarts
        - job_name
        - attempts
        - builder
        - created_at
        - updated_at
      type: object
    DeploymentStatus:
      enum:
        - build-pending
        - build-queued
        - build-running
        - build-succeeded
        - build-cancelled
        - build-failed
        - active
        - launching
        - launch-error
        - crashing
        - removed
      title: DeploymentStatus
      type: string
    DockerImage:
      additionalProperties: false
      properties:
        pull_count:
          format: int64
          type: integer
        repo_name:
          type: string
      required:
        - repo_name
        - pull_count
      type: object
    DockerTag:
      additionalProperties: false
      properties:
        full_size:
          format: int64
          type: integer
        name:
          type: string
        tag_last_pushed:
          type: string
      required:
        - name
      type: object
    EndpointDiscovery:
      additionalProperties: false
      properties:
        external:
          items:
