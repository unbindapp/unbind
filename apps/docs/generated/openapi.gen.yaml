info:
  title: Unbind API
  version: 1.0.0
openapi: 3.1.0
paths:
  /deployments/cancel:
    post:
      description: Abort a queued or running build. The deployment is marked as cancelled and its build job is deleted.
      operationId: cancel-deployment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDeploymentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelDeploymentOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
          description: Not Found
        "409":
          content:
            application/json:
