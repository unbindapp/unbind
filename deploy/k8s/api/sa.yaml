# Manual mirror of deploy/charts/charts/unbind/templates/sa.yaml - keep in sync.
# The chart's default-namespace secret Role is omitted: kustomization.yaml forces
# every namespaced resource into unbind-system.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unbind-api-sa
  namespace: unbind-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unbind-system-admin
  namespace: unbind-system
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unbind-system-admin-binding
  namespace: unbind-system
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: Role
  name: unbind-system-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: role-manager
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unbind-services-admin
rules:
  - apiGroups: ["unbind.unbind.app"]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-resources-reader
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
    resources: [
      "namespaces",
      "configmaps",
      "pods",
      "services",
      "deployments",
      "statefulsets",
      "replicasets",
      "daemonsets",
      "jobs",
      "cronjobs",
      "ingresses",
      "ingressclasses",
      "networkpolicies",
      "persistentvolumeclaims",
      "endpoints",
      "events"
    ]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "volumeattachments", "engines", "replicas", "settings", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "events", "persistentvolumeclaims", "pods", "pods/log", "pods/exec", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PersistentVolumes are cluster-scoped; released on volume delete, retained and re-pointed on rebinds
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-user authorization checks (e.g. pod exec)
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-manager-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: namespace-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: role-manager-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: role-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-services-admin-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: unbind-services-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-resources-reader-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: cluster-resources-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-manager-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: resource-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-reader-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unbind-updater-sa
  namespace: unbind-system
---
# cluster-admin: release manifests deliver arbitrary future cluster changes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-updater-admin-binding
subjects:
  - kind: ServiceAccount
    name: unbind-updater-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
