apiVersion: v1
kind: ServiceAccount
metadata:
  name: unbind-updater-sa
  namespace: unbind-system
---
# cluster-admin: release manifests deliver arbitrary future cluster changes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-updater-admin-binding
subjects:
  - kind: ServiceAccount
    name: unbind-updater-sa
    namespace: unbind-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
