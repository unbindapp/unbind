apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleanup-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unbind-registry-cleanup-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-registry-cleanup-pod-reader
subjects:
  - kind: ServiceAccount
    name: registry-cleanup-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: unbind-registry-cleanup-pod-reader
  apiGroup: rbac.authorization.k8s.io
