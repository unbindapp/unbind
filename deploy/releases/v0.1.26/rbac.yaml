apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unbind-longhorn-snapshot-manager
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["snapshots"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-longhorn-snapshot-manager-binding
subjects:
  - kind: ServiceAccount
    name: unbind-api-sa
    namespace: unbind-system
roleRef:
  kind: ClusterRole
  name: unbind-longhorn-snapshot-manager
  apiGroup: rbac.authorization.k8s.io
