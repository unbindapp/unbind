apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cleanup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "{{ .Values.cleanup.schedule | default "0 * * * *" }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cleanup.timeoutSeconds | default 3600 }}
      template:
        spec:
          serviceAccountName: registry-cleanup-sa
          containers:
            - name: registry-cleanup
              image: "{{ .Values.cleanup.image.repository }}:{{ .Values.cleanup.image.tag }}"
              imagePullPolicy: {{ .Values.cleanup.image.pullPolicy }}
              command: ["/app/cli", "registry:cleanup"]
              env:
                - name: SYSTEM_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: MAX_STORAGE
                  value: {{ .Values.cleanup.threshold | quote }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          restartPolicy: OnFailure
