{{- /* The API stores the cleanup threshold and schedule from System Settings on this CronJob, so an upgrade keeps them. */}}
{{- $schedule := .Values.cleanup.schedule | default "0 * * * *" }}
{{- $threshold := .Values.cleanup.threshold }}
{{- $live := lookup "batch/v1" "CronJob" .Release.Namespace "registry-cleanup" }}
{{- if $live }}
{{- $schedule = $live.spec.schedule }}
{{- range $live.spec.jobTemplate.spec.template.spec.containers }}
{{- range .env | default list }}
{{- if and (eq .name "MAX_STORAGE") .value }}
{{- $threshold = .value }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cleanup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ $schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run waits for the next schedule instead of retrying
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.cleanup.timeoutSeconds | default 3600 }}
      template:
        spec:
          serviceAccountName: registry-cleanup-sa
          containers:
            - name: registry-cleanup
              image: "{{ .Values.cleanup.image.repository }}:{{ .Values.cleanup.image.tag }}"
              imagePullPolicy: {{ .Values.cleanup.image.pullPolicy }}
              command: ["/app/cli", "registry:cleanup"]
              env:
                - name: SYSTEM_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: MAX_STORAGE
                  value: {{ $threshold | quote }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          restartPolicy: OnFailure
