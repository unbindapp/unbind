apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-cleanup-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleanup-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Cleanup waits for running builds before deleting anything
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-cleanup-rolebinding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: registry-cleanup-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: registry-cleanup-role
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-wide pod read so cleanup knows which images are deployed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unbind-registry-cleanup-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unbind-registry-cleanup-pod-reader
subjects:
  - kind: ServiceAccount
    name: registry-cleanup-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: unbind-registry-cleanup-pod-reader
  apiGroup: rbac.authorization.k8s.io
