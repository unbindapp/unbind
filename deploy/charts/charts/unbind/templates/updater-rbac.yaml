{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.updater.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "unbind.labels" . | nindent 4 }}
---
# cluster-admin: release manifests deliver arbitrary future cluster changes, and any
# pod-creator in the system namespace can mount this SA regardless.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "unbind.fullname" . }}-updater-admin-binding
  labels:
    {{- include "unbind.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.updater.serviceAccount.name }}
    namespace: {{ .Values.global.namespace }}
{{- end }}
