name: Deploy to Kubernetes
description: Deploy to Kubernetes
inputs:
  image:
    description: Image to deploy
    required: true
  kube_config:
    description: base64 encoded kube config
    required: true
runs:
  using: composite
  steps:
    - uses: imranismail/setup-kustomize@v1
      with:
        kustomize-version: "3.5.4"

    - name: Set image (api)
      working-directory: ./deploy/k8s/api
      shell: bash
      run: |
        kustomize edit set image replaceme=${{ inputs.image }}
        kustomize build . > ../ci.yaml

    - name: Deploy image to k8s cluster
      shell: bash
      env:
        KUBE_CONFIG_DATA: ${{ inputs.kube_config }}
      run: |
        export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
        trap 'rm -f "$KUBECONFIG"' EXIT
        (umask 077 && echo "$KUBE_CONFIG_DATA" | base64 -d > "$KUBECONFIG")
        kubectl apply -f ./deploy/k8s/ci.yaml
